services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-recipemanager}
      MYSQL_USER: ${DB_USERNAME:-recipemanager}
      MYSQL_PASSWORD: ${DB_PASSWORD:-recipemanager}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # コンテナ間はサービス名で名前解決できるため、DBのホストは "db"（サービス名）を指す
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-recipemanager}
      DB_USERNAME: ${DB_USERNAME:-recipemanager}
      DB_PASSWORD: ${DB_PASSWORD:-recipemanager}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # /api/* の転送先を、frontendコンテナから見えるbackendのサービス名に向ける
        # （next.config.tsのrewritesはビルド時に固定されるため、ビルド引数として渡す）
        BACKEND_INTERNAL_URL: http://backend:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
